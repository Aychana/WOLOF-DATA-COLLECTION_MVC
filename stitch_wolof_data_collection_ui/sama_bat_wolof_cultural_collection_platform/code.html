<body class="bg-background text-on-surface organic-pattern min-h-screen flex flex-col justify-center items-center px-gutter py-section-gap overflow-x-hidden">
<!-- Global Background Decor -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none opacity-40 z-[-1]">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary-fixed/30 rounded-full blur-[100px]"></div>
<div class="absolute -bottom-24 -left-24 w-80 h-80 bg-secondary-fixed/20 rounded-full blur-[80px]"></div>
</div>
<!-- Main Content Container -->
<main class="w-full max-w-[400px] flex flex-col items-center space-y-stack-lg z-10">
<!-- Branding & Logo Area -->
<header class="text-center animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="inline-flex items-center justify-center w-20 h-20 bg-primary-container rounded-2xl shadow-xl mb-stack-md transform hover:rotate-3 transition-transform cursor-pointer">
<span class="material-symbols-outlined text-on-primary-container !text-4xl" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-primary text-headline-lg-mobile md:text-headline-lg tracking-tight">Sama Bat</h1>
<p class="text-on-surface-variant font-body-md text-body-md mt-1 italic">La Voix de la Sagesse</p>
</header>
<!-- Login Form Card -->
<section class="w-full bg-surface-container-lowest p-stack-lg rounded-xl shadow-sm border border-outline-variant/30 animate-in fade-in slide-in-from-bottom-8 duration-700 delay-150">
<!-- Step Indicator -->
<div class="flex justify-between items-center mb-stack-lg">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-widest">Identification</span>
<span class="font-label-md text-label-md text-on-surface-variant bg-surface-container px-3 py-1 rounded-full">Étape 1/2</span>
</div>
<form action="#" class="space-y-stack-md" id="loginForm" method="POST">
<!-- ID/Email Input -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1" for="user-id">Email ou Identifiant Unique</label>
<div class="relative focus-ring rounded-lg group transition-all">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="account_circle">account_circle</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface border-1.5 border-outline-variant text-on-surface rounded-lg font-body-md text-body-md placeholder:text-outline focus:border-primary focus:ring-0 transition-all" id="user-id" name="user-id" placeholder="votre.nom@collecte.sn" required="" type="text"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#10b981] hover:bg-[#059669] text-on-secondary font-headline-md text-headline-md py-4 rounded-xl shadow-md btn-hover transition-all flex items-center justify-center gap-2 group mt-stack-lg" type="submit">
<span>Soumettre</span>
<span class="material-symbols-outlined transform group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Help & Auxiliary Actions -->
<div class="mt-stack-lg pt-stack-md border-t border-outline-variant/20 text-center">
<a class="inline-flex items-center gap-1 font-label-md text-label-md text-primary hover:text-primary-container transition-colors group" href="#">
<span class="material-symbols-outlined !text-[18px]" data-icon="help_outline">help_outline</span>
<span>Besoin d'aide ?</span>
</a>
</div>
</section>
<!-- Visual Anchor / Footer Note -->
<footer class="text-center space-y-2 pt-stack-md">
<p class="font-label-sm text-label-sm text-outline-variant">
                En continuant, vous contribuez à la préservation de la culture Wolof.
            </p>
<div class="flex justify-center gap-3 opacity-30">
<div class="w-8 h-1 bg-primary rounded-full"></div>
<div class="w-8 h-1 bg-secondary rounded-full"></div>
<div class="w-8 h-1 bg-tertiary-fixed-dim rounded-full"></div>
</div>
</footer>
</main>
<!-- Micro-interactions Script -->
<script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const originalText = btn.innerHTML;
            
            // Success Feedback Simulation
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span><span>Vérification...</span>`;
            btn.disabled = true;
            btn.style.opacity = '0.8';

            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span><span>Succès !</span>`;
                btn.style.backgroundColor = '#059669';
                
                // Add ripple effect or redirection logic here
                console.log('Authenticating user...');
            }, 1200);
        });

        // Ambient hover effect on logo
        const logo = document.querySelector('header div');
        logo.addEventListener('mousemove', (e) => {
            const rect = logo.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            logo.style.transform = `perspective(1000px) rotateX(${(y - rect.height/2)/5}deg) rotateY(${-(x - rect.width/2)/5}deg) scale(1.05)`;
        });
        
        logo.addEventListener('mouseleave', () => {
            logo.style.transform = 'none';
        });
    </script>
