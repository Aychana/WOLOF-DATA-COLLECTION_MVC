<body class="bg-background text-on-surface organic-pattern min-h-screen flex flex-col items-center justify-center font-body-md p-gutter">
<!-- Top Branding -->
<header class="fixed top-0 left-0 w-full flex justify-center py-stack-lg z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">cloud_done</span>
</div>
</header>
<main class="w-full max-w-[440px] flex flex-col items-center mt-16 animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Step Indicator -->
<div class="mb-stack-md">
<span class="bg-primary-container text-on-primary-container font-label-sm text-label-sm px-4 py-1.5 rounded-full">
                Étape 2/2
            </span>
</div>
<!-- Heading Section -->
<div class="text-center mb-stack-lg">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">
                Confirmez votre accès
            </h1>
<p class="font-body-md text-on-surface-variant max-w-[320px] mx-auto">
                Nous avons envoyé un code de vérification à 6 chiffres sur votre boîte mail.
            </p>
</div>
<!-- OTP Form -->
<div class="w-full bg-surface-container-lowest border border-outline-variant p-8 rounded-[2rem] shadow-sm">
<form class="space-y-stack-lg" id="otp-form">
<!-- OTP Inputs Container -->
<div class="flex justify-between gap-2 md:gap-3" id="otp-container">
<input class="otp-input w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-bold bg-surface-container-low border-1.5 border-outline rounded-xl focus:outline-none transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input class="otp-input w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-bold bg-surface-container-low border-1.5 border-outline rounded-xl focus:outline-none transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input class="otp-input w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-bold bg-surface-container-low border-1.5 border-outline rounded-xl focus:outline-none transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input class="otp-input w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-bold bg-surface-container-low border-1.5 border-outline rounded-xl focus:outline-none transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input class="otp-input w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-bold bg-surface-container-low border-1.5 border-outline rounded-xl focus:outline-none transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input class="otp-input w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-bold bg-surface-container-low border-1.5 border-outline rounded-xl focus:outline-none transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
</div>
<!-- Feedback Message (Hidden by default) -->
<div class="hidden text-center py-2 px-4 rounded-lg flex items-center justify-center gap-2" id="status-message">
<span class="material-symbols-outlined text-xl" id="status-icon"></span>
<span class="font-label-md text-label-md" id="status-text"></span>
</div>
<!-- Timer -->
<div class="flex justify-center items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-lg">timer</span>
<span class="font-label-md text-label-md tabular-nums" id="timer">01:59</span>
</div>
<!-- Primary Action -->
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-4 px-6 rounded-xl hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-2" type="submit">
                    Vérifier le code
                    <span class="material-symbols-outlined">verified_user</span>
</button>
</form>
<!-- Resend Section -->
<div class="mt-8 pt-6 border-t border-outline-variant/30 text-center">
<p class="font-body-md text-on-surface-variant mb-2">Je n'ai pas reçu le code</p>
<button class="text-primary font-label-md text-label-md hover:underline decoration-secondary underline-offset-4" type="button">
                    Renvoyer un nouveau code
                </button>
</div>
</div>
<!-- Support Info -->
<footer class="mt-stack-lg text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                Besoin d'aide ? <a class="text-primary font-bold" href="#">Contactez le support</a>
</p>
</footer>
</main>
<script>
        // OTP Inputs Focus Logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Countdown Timer Logic
        let timeLeft = 119; // 1:59 in seconds
        const timerElement = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.classList.add('text-error');
            }
            timeLeft--;
        }, 1000);

        // Form Submission Simulation
        const form = document.getElementById('otp-form');
        const statusBox = document.getElementById('status-message');
        const statusText = document.getElementById('status-text');
        const statusIcon = document.getElementById('status-icon');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const otpCode = Array.from(inputs).map(i => i.value).join('');
            
            statusBox.classList.remove('hidden');
            
            if (otpCode.length < 6) {
                // Error State
                statusBox.className = "text-center py-2 px-4 rounded-lg flex items-center justify-center gap-2 bg-error-container text-error";
                statusText.textContent = "Veuillez entrer les 6 chiffres du code.";
                statusIcon.textContent = "error";
                
                // Shake effect
                form.classList.add('animate-shake');
                setTimeout(() => form.classList.remove('animate-shake'), 400);
            } else if (otpCode === "000000") {
                // Success State Simulation
                statusBox.className = "text-center py-2 px-4 rounded-lg flex items-center justify-center gap-2 bg-secondary-container text-on-secondary-container";
                statusText.textContent = "Vérification réussie ! Redirection...";
                statusIcon.textContent = "check_circle";
                
                // Add a small scale effect to inputs
                inputs.forEach(i => i.classList.add('border-secondary', 'bg-secondary-container/20'));
            } else {
                // Generic Error
                statusBox.className = "text-center py-2 px-4 rounded-lg flex items-center justify-center gap-2 bg-[#ef444415] text-[#ef4444]";
                statusText.textContent = "Code incorrect. Veuillez réessayer.";
                statusIcon.textContent = "warning";
            }
        });
    </script>
<style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</body></html>
