<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Changement Mot de Passe - Collection Wolof</title>
  <link rel="stylesheet" href="style_admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="admin-page admin-page--cp">

  <header class="admin-top-bar">
    <div class="top-bar__left">
      <a href="admin.html" class="logo-link" aria-label="Retour au back office">
        <div class="logo-mini" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/>
          </svg>
        </div>
      </a>
      <h1 class="page-title">Changement de mot de passe</h1>
    </div>
    <div class="top-bar__right">
      <span class="admin-name" id="adminName">Admin</span>
    </div>
  </header>

  <main class="admin-main admin-main--narrow">
    <div class="password-container">
      <a href="admin.html" class="breadcrumb-link">← Retour à la gestion</a>

      <div class="password-card">
        <h2 class="card-title">Sécurisez votre compte</h2>
        <p class="card-subtitle">Changez votre mot de passe régulièrement pour maintenir la sécurité de votre compte.</p>

        <form id="changePasswordForm" class="password-form" novalidate>
          <div class="form-group">
            <label for="oldPassword" class="form-label">Ancien mot de passe</label>
            <div class="input-wrapper input-wrapper--toggle">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="oldPassword" name="old_password" class="form-input" autocomplete="current-password" required />
              <button type="button" class="input-toggle-btn" data-target="oldPassword" aria-label="Afficher le mot de passe">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="newPassword" class="form-label">Nouveau mot de passe</label>
            <div class="input-wrapper input-wrapper--toggle">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>              
              </span>
              <input type="password" id="newPassword" name="new_password" class="form-input" autocomplete="new-password" required />
              <button type="button" class="input-toggle-btn" data-target="newPassword" aria-label="Afficher le mot de passe">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="strength-container">
              <div class="strength-meter"><div class="strength-bar" id="strengthBar"></div></div>
              <span id="strengthText" class="strength-text">Très faible</span>
            </div>
            <div class="requirements">
              <div class="requirement" id="req-length"><span class="requirement-check">✗</span><span>Au moins 8 caractères</span></div>
              <div class="requirement" id="req-upper"><span class="requirement-check">✗</span><span>Au moins une majuscule (A-Z)</span></div>
              <div class="requirement" id="req-lower"><span class="requirement-check">✗</span><span>Au moins une minuscule (a-z)</span></div>
              <div class="requirement" id="req-number"><span class="requirement-check">✗</span><span>Au moins un chiffre (0-9)</span></div>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
            <div class="input-wrapper input-wrapper--toggle">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
              </span>
              <input type="password" id="confirmPassword" name="confirm_password" class="form-input" autocomplete="new-password" required />
              <button type="button" class="input-toggle-btn" data-target="confirmPassword" aria-label="Afficher le mot de passe">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div id="matchMessage" class="match-message" hidden></div>
          </div>

          <div class="form-actions">
            <a href="admin.html" class="btn btn-secondary">Annuler</a>
            <button type="submit" id="submitBtn" class="btn btn-primary">Changer le mot de passe</button>
          </div>
        </form>

        <div id="message" class="message" hidden role="status"></div>
      </div>
    </div>
  </main>

  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="admin-change-password.js"></script>
</body>
</html>
