<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentification - Collection Wolof</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">

  <div class="auth-container">

    <div class="auth-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/>
      </svg>
    </div>

    <div class="auth-card">
      <div class="auth-card__head">
        <h1 class="auth-title">Authentification</h1>
        <span class="step-badge">Étape 1/2</span>
      </div>

      <p class="auth-subtitle">Entrez votre email ou téléphone pour accéder à votre espace contributeur.</p>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="identifier" class="form-label">Email ou téléphone</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
              </svg>
            </span>
            <input
              type="text"
              id="identifier"
              name="identifier"
              class="form-input"
              placeholder="votre.nom@collecte.sn"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
          <span class="btn-text">Soumettre</span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <div id="message" class="message" hidden role="status" aria-live="polite"></div>

      <div class="auth-footer">
        <p class="help-text">
          <span class="help-icon" aria-hidden="true">?</span>
          Besoin d'aide ? <a href="mailto:support@solidafrique.sn" class="help-link">Contactez le support</a>
        </p>
      </div>
    </div>

    <div class="auth-branding">
      <p>En continuant, vous contribuez au développement de la langue Wolof.</p>
      <div class="auth-branding__dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </div>

    <a href="index.html" class="auth-back-home">← Retour à l'accueil</a>
  </div>

  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="login.js"></script>
</body>
</html>
