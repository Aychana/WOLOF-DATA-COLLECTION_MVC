<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes contributions - Collection Wolof</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="page-contributeur page-history">

  <header class="top-bar">
    <div class="top-bar__left">
      <a href="index.html" class="logo-link" aria-label="Retour à l'accueil">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/>
          </svg>
        </div>
      </a>
    </div>
    <div class="top-bar__right">
      <a href="profile.html" class="profile-btn" aria-label="Mon profil">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
        </svg>
      </a>
    </div>
  </header>

  <main class="main-content main-content--wide">

    <section class="page-header">
      <div class="page-header__left">
        <a href="index.html" class="back-link">← Retour à l'accueil</a>
      </div>
      <div class="page-header__center">
        <h1>Mes contributions</h1>
        <p>Gérez et suivez l'état de vos enregistrements de sagesse.</p>
      </div>
      <div class="page-header__right">
        <button type="button" id="refreshHistory" class="refresh-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.13-3.36L23 10M1 14l5.36 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          Actualiser
        </button>
      </div>
    </section>

    <section class="search-filters" aria-label="Recherche et filtres">
      <div class="search-filters__row">
        <div class="search-box">
          <svg class="search-box__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="search" id="searchInput" class="search-input"
            placeholder="Rechercher par transcription ou ID..." autocomplete="off" />
        </div>
        <div class="sort-box">
          <label for="sortBy">Trier par :</label>
          <select id="sortBy" class="sort-select">
            <option value="recent">Plus récent</option>
            <option value="old">Plus ancien</option>
            <option value="status">Statut</option>
          </select>
        </div>
      </div>
      <div class="filter-tabs" role="tablist" aria-label="Filtrer par statut">
        <button type="button" class="filter-tab active" data-filter="" role="tab" aria-selected="true">Tous</button>
        <button type="button" class="filter-tab filter-tab--E" data-filter="E" role="tab" aria-selected="false">Envoyé</button>
        <button type="button" class="filter-tab filter-tab--V" data-filter="V" role="tab" aria-selected="false">Validé</button>
        <button type="button" class="filter-tab filter-tab--R" data-filter="R" role="tab" aria-selected="false">Rejeté</button>
        <button type="button" class="filter-tab filter-tab--A" data-filter="A" role="tab" aria-selected="false">Archivé</button>
      </div>
    </section>

    <section class="history-table-section" aria-label="Liste des contributions">
      <div class="history-table-wrap">
        <table class="history-table" id="historyTable">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Date</th>
              <th scope="col">Transcription (aperçu)</th>
              <th scope="col">Statut</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr class="loading-row">
              <td colspan="5">Chargement de l'historique…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="pagination-section" aria-label="Pagination">
      <p id="paginationInfo">Affichage 0-0 sur 0 contributions</p>
      <div class="pagination">
        <button type="button" id="prevBtn" class="pagination-btn" disabled>← Précédent</button>
        <div id="pageNumbers" class="page-numbers" role="navigation" aria-label="Pages"></div>
        <button type="button" id="nextBtn" class="pagination-btn" disabled>Suivant →</button>
      </div>
    </section>

  </main>

  <div id="detailsModal" class="modal" hidden>
    <div class="modal-overlay" data-close="details"></div>
    <div class="modal-content" role="dialog" aria-labelledby="detailsModalTitle">
      <div class="modal-header">
        <h2 id="detailsModalTitle">Détails de l'enregistrement</h2>
        <button type="button" class="modal-close" data-close="details" aria-label="Fermer">×</button>
      </div>
      <div class="modal-body">
        <div class="detail-field">
          <label>ID Audio</label>
          <p id="detailId"></p>
        </div>
        <div class="detail-field">
          <label>Date</label>
          <p id="detailDate"></p>
        </div>
        <div class="detail-field">
          <label>Audio</label>
          <audio id="detailAudio" controls preload="metadata"></audio>
        </div>
        <div class="detail-field">
          <label>Transcription</label>
          <p id="detailTranscription" class="detail-text"></p>
        </div>
        <div class="detail-field">
          <label>Traduction</label>
          <p id="detailTraduction" class="detail-text"></p>
        </div>
        <div class="detail-field">
          <label>Statut</label>
          <span id="detailStatus" class="table-badge"></span>
        </div>
        <div class="detail-field" id="rejectionReasonField" hidden>
          <label>Raison du rejet</label>
          <p id="detailRejectionReason" class="rejection-text"></p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="editDetailBtn" class="btn btn-secondary" hidden>Éditer</button>
        <button type="button" id="deleteDetailBtn" class="btn btn-error" hidden>Supprimer</button>
        <button type="button" class="btn btn-primary" data-close="details">Fermer</button>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal" hidden>
    <div class="modal-overlay" data-close="edit"></div>
    <div class="modal-content" role="dialog" aria-labelledby="editModalTitle">
      <div class="modal-header">
        <h2 id="editModalTitle">Modifier l'enregistrement</h2>
        <button type="button" class="modal-close" data-close="edit" aria-label="Fermer">×</button>
      </div>
      <form id="editForm" class="modal-body">
        <input type="hidden" id="editAudioId" name="id" />
        <div class="form-group">
          <label for="editTranscription">Transcription Wolof</label>
          <textarea id="editTranscription" name="transcription"
            placeholder="Modifiez la transcription…" required></textarea>
        </div>
        <div class="form-group">
          <label for="editTraduction">Traduction Français</label>
          <textarea id="editTraduction" name="traduction"
            placeholder="Modifiez la traduction…" required></textarea>
        </div>
        <p id="editMessage" class="message" role="status"></p>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close="edit">Annuler</button>
        <button type="submit" form="editForm" class="btn btn-primary">Enregistrer</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span>Accueil</span>
    </a>
    <a href="history.html" class="nav-item active">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
      </svg>
      <span>Historique</span>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      <span>Profil</span>
    </a>
  </nav>

  <script src="history.js"></script>
</body>
</html>
