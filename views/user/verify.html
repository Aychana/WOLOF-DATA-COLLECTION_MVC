<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vérification - Collection Wolof</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="auth-page auth-page--verify">

  <div class="auth-container">

    <div class="auth-logo auth-logo--verify" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>

    <div class="step-indicator">
      <span class="step-badge">Étape 2/2</span>
    </div>

    <div class="auth-card">
      <h1 class="auth-title auth-title--center">Confirmez votre accès</h1>

      <p class="auth-subtitle auth-subtitle--center">
        Nous avons envoyé un code de vérification à 6 chiffres sur
        <strong id="userIdentifier">votre email</strong>
      </p>

      <p id="codeHint" class="code-hint" hidden role="status"></p>

      <form id="verifyForm" class="auth-form" novalidate>
        <input type="hidden" id="identifierInput" name="identifier" />

        <div class="otp-container">
          <label class="form-label form-label--center">Code OTP</label>
          <div class="otp-inputs" id="otpInputs">
            <input type="text" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chiffre 1" autocomplete="one-time-code" />
            <input type="text" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chiffre 2" />
            <input type="text" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chiffre 3" />
            <input type="text" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chiffre 4" />
            <input type="text" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chiffre 5" />
            <input type="text" class="otp-input" inputmode="numeric" maxlength="1" pattern="[0-9]" aria-label="Chiffre 6" />
          </div>
          <input type="hidden" id="codeInput" name="code" />
        </div>

        <div class="timer-container">
          <span class="timer-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
          </span>
          <span id="timerText" class="timer-text">10:00</span>
        </div>

        <button type="submit" id="verifyBtn" class="btn btn-primary btn-block">
          <span class="btn-text">Vérifier le code</span>
          <span class="btn-shield" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M9 12l2 2 4-4"/>
            </svg>
          </span>
        </button>
      </form>

      <div id="message" class="message" hidden role="status" aria-live="polite"></div>

      <div class="auth-footer auth-footer--verify">
        <p class="help-text">
          Je n'ai pas reçu le code
          <button type="button" id="resendBtn" class="help-link help-link--btn">Renvoyer un nouveau code</button>
        </p>
        <p class="help-text support-text">
          Besoin d'aide ? <a href="mailto:support@solidafrique.sn" class="help-link">Contactez le support</a>
        </p>
      </div>
    </div>

    <div class="auth-branding">
      <p>En continuant, vous contribuez à la préservation de la culture Wolof.</p>
    </div>

    <a href="login-user" class="auth-back-home">← Retour à la connexion</a>
  </div>

  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="verify.js"></script>
</body>
</html>
